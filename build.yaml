# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: hshs52_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: hshs52_right nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: hshs46_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: hshs46_right nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: settings_reset
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      artifact-name: firmware
      boards-shields: |
        nice_nano//zmk hshs46_left nice_view nice_view_adapter
        nice_nano//zmk hshs46_right nice_view nice_view_adapter
        seeeduino_xiao_ble//zmk hshs46_dongle
